name: QNX Vehicle Resource Manager — CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Logic tests on Linux (no QNX license needed) ─────────────
  test-host-build:
    name: "Host Build + Unit Tests (Linux)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y build-essential

      - name: Build CAN simulator (host mode)
        run: |
          gcc -Wall -Wextra -O2 -Isrc \
              -DHOST_BUILD \
              -o test_can_sim \
              tests/test_can_sim.c src/can_simulator.c \
              -lm
          echo "Host build: OK"

      - name: Run unit tests
        run: |
          ./test_can_sim
          echo "Exit code: $?"

      - name: Build vehicle bridge (host mode — socket logic)
        run: |
          gcc -Wall -Wextra -O2 -Isrc \
              -DHOST_BUILD \
              -c src/vehicle_bridge.c -o vehicle_bridge.o
          echo "Bridge compile: OK"

  # ── Job 2: Static analysis ───────────────────────────────────────────
  static-analysis:
    name: "Static Analysis (cppcheck)"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=all \
                   --suppress=missingInclude \
                   --suppress=unusedFunction \
                   --suppress=unmatchedSuppression \
                   --error-exitcode=1 \
                   -I src \
                   -D HOST_BUILD \
                   src/
          echo "Static analysis: PASSED"
